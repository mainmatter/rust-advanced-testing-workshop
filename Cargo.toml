[workspace]
members = [
  "ctr",
  "exercises/*/*",
  "exercises/08_macros/01_no_op_macro/macros01",
  "exercises/08_macros/02_test/macros02",
  "exercises/08_macros/03_hooks/macros03",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.102"
cargo-manifest = "0.21"
dotenvy = "0.15.7"
fs-err = "3.3.0"
googletest = "0.14.2"
http = "1"
insta = "1.47"
libtest-mimic = "0.8.2"
maplit = "1"
mockall = "0.14"
once_cell = "1.21.4"
owo-colors = "4"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.106"
quote = "1.0.45"
regex = "1.12.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
semver = "1.0.28"
serde = "1"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "migrate"] }
static_assertions = "1.1.0"
syn = "2"
tempfile = "3.27.0"
textwrap = "0.16.2"
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
wiremock = "0.6.5"
